version: '3.8'

services:
  # Database PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: smartelevator-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: smartelevator_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Backend NestJS Central Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartelevator-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://admin:adminpassword@postgres:5432/smartelevator_db
      DEVICE_IP: http://host.docker.internal:8080
    depends_on:
      - postgres

  # Frontend React Web Admin
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartelevator-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
